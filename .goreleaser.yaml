version: 2

project_name: mistermorph

before:
  hooks:
    - go mod download

builds:
  - id: mistermorph
    main: ./cmd/mistermorph
    binary: mistermorph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

dockers:
  - id: amd64
    ids:
      - mistermorph
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "ghcr.io/quailyquaily/mistermorph:{{ .Version }}-amd64"
      - "ghcr.io/quailyquaily/mistermorph:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"

  - id: arm64
    ids:
      - mistermorph
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - "ghcr.io/quailyquaily/mistermorph:{{ .Version }}-arm64"
      - "ghcr.io/quailyquaily/mistermorph:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/quailyquaily/mistermorph:{{ .Version }}"
    image_templates:
      - "ghcr.io/quailyquaily/mistermorph:{{ .Version }}-amd64"
      - "ghcr.io/quailyquaily/mistermorph:{{ .Version }}-arm64"
  - name_template: "ghcr.io/quailyquaily/mistermorph:latest"
    image_templates:
      - "ghcr.io/quailyquaily/mistermorph:latest-amd64"
      - "ghcr.io/quailyquaily/mistermorph:latest-arm64"

archives:
  - id: default
    ids:
      - mistermorph
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
