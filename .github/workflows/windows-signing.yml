name: Build and Sign Windows Release
run-name: Build and sign Windows for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and sign
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-package:
    name: Build, Sign, and Package Windows Artifacts
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Validate target release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z._+-]*$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $matchingTag = git tag --points-at HEAD | Where-Object { $_ -eq $env:RELEASE_TAG }
          if (-not $matchingTag) {
            throw "Checked out commit is not tagged with $env:RELEASE_TAG"
          }
          gh release view $env:RELEASE_TAG | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release does not exist: $env:RELEASE_TAG"
          }

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir web/console install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/console build

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Verify desktop package compiles
        run: go test -tags "wailsdesktop production" ./desktop/wails -count=1

      - name: Generate Windows desktop resources
        shell: bash
        env:
          ARCH: amd64
        run: ./scripts/generate-desktop-windows-resources.sh

      - name: Build unsigned Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          unsigned_dir="dist/windows-unsigned"
          mkdir -p "${unsigned_dir}"

          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          commit_date="$(git show -s --format=%cI HEAD)"
          cli_ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${commit_date}"

          GOOS=windows GOARCH=amd64 \
            go build -trimpath -tags "wailsdesktop production" \
            -ldflags "-s -w -X main.desktopVersion=${version} -H=windowsgui" \
            -o "${unsigned_dir}/MrMorph.exe" ./desktop/wails

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" \
            -o "${unsigned_dir}/morph.exe" ./cmd/mistermorph

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "${cli_ldflags}" \
            -o "${unsigned_dir}/morph-amd64.exe" ./cmd/mistermorph

          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 \
            go build -trimpath -ldflags "${cli_ldflags}" \
            -o "${unsigned_dir}/morph-arm64.exe" ./cmd/mistermorph

      - name: Setup Java for CodeSignTool
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Download CodeSignTool
        shell: pwsh
        env:
          CODESIGNTOOL_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip
          CODESIGNTOOL_SHA256: f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "CodeSignTool-v1.3.2.zip"
          $toolRoot = Join-Path $env:RUNNER_TEMP "CodeSignTool-v1.3.2"

          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CODESIGNTOOL_SHA256) {
            throw "CodeSignTool checksum mismatch: $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $toolRoot -Force
          "CODESIGNTOOL_ROOT=$toolRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows binaries with SSL.com eSigner
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          foreach ($secretName in @("ES_USERNAME", "ES_PASSWORD", "ES_CREDENTIAL_ID", "ES_TOTP_SECRET")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Required secret is empty: $secretName"
            }
          }

          $jar = Join-Path $env:CODESIGNTOOL_ROOT "jar/code_sign_tool-1.3.2.jar"
          $unsignedDir = (Resolve-Path "dist/windows-unsigned").Path
          $signedDir = Join-Path $env:GITHUB_WORKSPACE "dist/windows-signed"
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null

          function Invoke-CodeSignTool {
            param(
              [Parameter(Mandatory)]
              [string[]]$ToolArguments,
              [Parameter(Mandatory)]
              [string]$ExpectedOutput
            )

            $processInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $processInfo.FileName = "java"
            $processInfo.UseShellExecute = $false
            $processInfo.WorkingDirectory = $env:CODESIGNTOOL_ROOT
            $processInfo.RedirectStandardOutput = $true
            $processInfo.RedirectStandardError = $true

            $arguments = @("-Xmx1024M", "-jar", $jar) + $ToolArguments
            foreach ($argument in $arguments) {
              [void]$processInfo.ArgumentList.Add($argument)
            }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $processInfo
            try {
              [void]$process.Start()
              $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              $stderrTask = $process.StandardError.ReadToEndAsync()
              $process.WaitForExit()
              $stdout = $stdoutTask.GetAwaiter().GetResult()
              $stderr = $stderrTask.GetAwaiter().GetResult()
              $exitCode = $process.ExitCode
            } finally {
              $process.Dispose()
            }

            if (-not [string]::IsNullOrWhiteSpace($stdout)) {
              Write-Host ($stdout.TrimEnd())
            }
            if (-not [string]::IsNullOrWhiteSpace($stderr)) {
              Write-Host ($stderr.TrimEnd())
            }
            if ($exitCode -ne 0) {
              throw "CodeSignTool failed with exit code $exitCode"
            }
            $combinedOutput = "$stdout`n$stderr"
            if (-not $combinedOutput.Contains($ExpectedOutput)) {
              throw "CodeSignTool did not report success"
            }
          }

          $unsignedFiles = @(Get-ChildItem $unsignedDir -File -Filter "*.exe" | Sort-Object Name)
          if ($unsignedFiles.Count -ne 4) {
            throw "Expected 4 unsigned executables, found $($unsignedFiles.Count)"
          }

          foreach ($file in $unsignedFiles) {
            Write-Host "Scanning $($file.Name) for malware"
            $scanArguments = @(
              "scan_code",
              "-username=$env:ES_USERNAME",
              "-password=$env:ES_PASSWORD",
              "-credential_id=$env:ES_CREDENTIAL_ID",
              "-input_file_path=$($file.FullName)"
            )
            Invoke-CodeSignTool `
              -ToolArguments $scanArguments `
              -ExpectedOutput "code object is not a malware. You can proceed signing this code object"
          }

          $signArguments = @(
            "batch_sign",
            "-username=$env:ES_USERNAME",
            "-password=$env:ES_PASSWORD",
            "-credential_id=$env:ES_CREDENTIAL_ID",
            "-totp_secret=$env:ES_TOTP_SECRET",
            "-input_dir_path=$unsignedDir",
            "-output_dir_path=$signedDir"
          )
          Invoke-CodeSignTool `
            -ToolArguments $signArguments `
            -ExpectedOutput "Batch sign command executed successfully."

          $signedFiles = @(Get-ChildItem $signedDir -File -Filter "*.exe")
          if ($signedFiles.Count -ne $unsignedFiles.Count) {
            throw "Expected $($unsignedFiles.Count) signed executables, found $($signedFiles.Count)"
          }
          foreach ($file in $unsignedFiles) {
            $signedPath = Join-Path $signedDir $file.Name
            if (-not (Test-Path -LiteralPath $signedPath -PathType Leaf)) {
              throw "Signed executable is missing: $($file.Name)"
            }
          }

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe was not found"
          }

          $signedFiles = Get-ChildItem "dist/windows-signed" -Filter "*.exe"
          if ($signedFiles.Count -ne 4) {
            throw "Expected 4 signed executables, found $($signedFiles.Count)"
          }
          foreach ($file in $signedFiles) {
            & $signtool verify /pa /all /v /tw $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed: $($file.Name)"
            }
          }

      - name: Package Windows release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $signedDir = "dist/windows-signed"
          $releaseDir = "dist/release-upload"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $desktopAsset = "mistermorph-desktop-windows-amd64.zip"
          $desktopDir = "dist/package-desktop"
          New-Item -ItemType Directory -Force -Path $desktopDir | Out-Null
          Copy-Item "$signedDir/MrMorph.exe" "$desktopDir/MrMorph.exe"
          Copy-Item "$signedDir/morph.exe" "$desktopDir/morph.exe"
          Copy-Item "LICENSE" "$desktopDir/LICENSE"
          @"
          MisterMorph Desktop for Windows.

          Keep MrMorph.exe and morph.exe in the same directory.
          Launch the app with MrMorph.exe.
          "@ | Set-Content "$desktopDir/README-desktop.txt" -Encoding utf8NoBOM
          Compress-Archive -Path "$desktopDir/*" -DestinationPath "$releaseDir/$desktopAsset"

          $cliPackages = @(
            @{
              Source = "$signedDir/morph-amd64.exe"
              Asset = "mistermorph_${version}_windows_amd64.zip"
              Staging = "dist/package-cli-amd64"
            },
            @{
              Source = "$signedDir/morph-arm64.exe"
              Asset = "mistermorph_${version}_windows_arm64.zip"
              Staging = "dist/package-cli-arm64"
            }
          )
          foreach ($package in $cliPackages) {
            New-Item -ItemType Directory -Force -Path $package.Staging | Out-Null
            Copy-Item $package.Source "$($package.Staging)/morph.exe"
            Copy-Item "LICENSE" "$($package.Staging)/LICENSE"
            Copy-Item "README.md" "$($package.Staging)/README.md"
            Compress-Archive -Path "$($package.Staging)/*" -DestinationPath "$releaseDir/$($package.Asset)"
          }

          $desktopHash = (Get-FileHash -Algorithm SHA256 "$releaseDir/$desktopAsset").Hash.ToLower()
          "$desktopHash *$desktopAsset" |
            Set-Content "$releaseDir/$desktopAsset.sha256" -Encoding ascii

      - name: Merge Windows CLI checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $releaseDir = "dist/release-upload"
          $checksumDir = "dist/existing-checksums"
          New-Item -ItemType Directory -Force -Path $checksumDir | Out-Null

          gh release download $env:RELEASE_TAG `
            --pattern "checksums.txt" `
            --dir $checksumDir
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the GoReleaser checksum file"
          }

          $cliAssets = @(
            "mistermorph_${version}_windows_amd64.zip",
            "mistermorph_${version}_windows_arm64.zip"
          )
          $checksumLines = @()
          foreach ($line in Get-Content "$checksumDir/checksums.txt") {
            $isWindowsCLI = $false
            foreach ($asset in $cliAssets) {
              if ($line.TrimEnd().EndsWith($asset)) {
                $isWindowsCLI = $true
                break
              }
            }
            if (-not $isWindowsCLI) {
              $checksumLines += $line
            }
          }
          foreach ($asset in $cliAssets) {
            $hash = (Get-FileHash -Algorithm SHA256 "$releaseDir/$asset").Hash.ToLower()
            $checksumLines += "$hash  $asset"
          }
          $checksumLines |
            Sort-Object |
            Set-Content "$releaseDir/checksums.txt" -Encoding ascii

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseAssets = Get-ChildItem "dist/release-upload" -File |
            Where-Object { $_.Name -ne "checksums.txt" }
          foreach ($asset in $releaseAssets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset: $($asset.Name)"
            }
          }
          gh release upload $env:RELEASE_TAG "dist/release-upload/checksums.txt" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release asset: checksums.txt"
          }

      - name: Generate Windows update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $manifestDir = "dist/update-manifest"
          $checksumDir = "$manifestDir/checksums"
          New-Item -ItemType Directory -Force -Path $checksumDir | Out-Null

          gh release download $env:RELEASE_TAG `
            --pattern "mistermorph-desktop-*.sha256" `
            --dir $checksumDir `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download desktop checksum files"
          }

          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" |
            Set-Content "$manifestDir/release.json" -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch release metadata"
          }

          go run ./scripts/release-update-manifest `
            -release-json "$manifestDir/release.json" `
            -artifacts-dir $checksumDir `
            -output "dist/update.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate Windows update manifest"
          }

      - name: Upload Windows update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "dist/update.json" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload update.json"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ inputs.tag }}
          path: |
            dist/release-upload/*
            dist/update.json
          if-no-files-found: error
          retention-days: 3
