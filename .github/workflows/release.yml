name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir web/console install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/console build

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser (tag release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (snapshot)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist/*
          retention-days: 3

  desktop-apps:
    name: Build Desktop App (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            desktop_asset: mistermorph-desktop-linux-amd64.AppImage
            deb_asset: mistermorph-desktop-linux-amd64.deb
            update_asset: mistermorph-desktop-linux-amd64.tar.gz
            raw_desktop_binary: dist/MrMorph
            bundled_backend_binary: dist/morph
            package_kind: appimage
            go_build_tags: "wailsdesktop production"
          - label: macos-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            desktop_asset: mistermorph-desktop-darwin-arm64.dmg
            deb_asset: ""
            update_asset: mistermorph-desktop-darwin-arm64.tar.gz
            raw_desktop_binary: dist/MrMorph
            bundled_backend_binary: dist/morph
            package_kind: dmg
            go_build_tags: "wailsdesktop production"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir web/console install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/console build

      - name: Stage console assets
        shell: bash
        run: ./scripts/stage-console-assets.sh

      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify desktop package compiles
        run: go test -tags "${{ matrix.go_build_tags }}" ./desktop/wails -count=1

      - name: Build desktop app binary
        shell: bash
        run: |
          mkdir -p dist
          desktop_version="${GITHUB_REF_NAME#v}"
          desktop_ldflags="-s -w -X main.desktopVersion=${desktop_version}"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -tags "${{ matrix.go_build_tags }}" -ldflags "${desktop_ldflags}" -o "${{ matrix.raw_desktop_binary }}" ./desktop/wails

      - name: Build bundled backend binary
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags "-s -w" -o "${{ matrix.bundled_backend_binary }}" ./cmd/mistermorph

      - name: Validate macOS signing secrets
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_CODESIGN_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release secrets:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import macOS signing certificate
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="$(mktemp "${RUNNER_TEMP}/cert.XXXXXX").p12"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_FILE}"
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security import "${CERT_FILE}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "${KEYCHAIN}"
          rm -f "${CERT_FILE}"

      - name: Package macOS DMG
        if: matrix.package_kind == 'dmg'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          BUNDLED_BACKEND_NAME="morph" \
          TARBALL_PATH="dist/${{ matrix.update_asset }}" \
          CODESIGN_IDENTITY="${CODESIGN_IDENTITY}" \
          APPLE_ID="${APPLE_ID}" \
          APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
          APPLE_APP_PASSWORD="${APPLE_APP_PASSWORD}" \
          ./desktop/wails/packaging/package-darwin.sh

      - name: Package Linux AppImage
        if: matrix.package_kind == 'appimage'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          APPIMAGE_NAME="${{ matrix.desktop_asset }}" \
          TARBALL_PATH="dist/${{ matrix.update_asset }}" \
          ./desktop/wails/packaging/package-linux-appimage.sh

      - name: Package Linux DEB
        if: matrix.package_kind == 'appimage'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}" \
          ARCH="${ARCH}" \
          DESKTOP_BIN="${{ matrix.raw_desktop_binary }}" \
          BACKEND_BIN="${{ matrix.bundled_backend_binary }}" \
          OUT_DIR="dist" \
          DEB_NAME="${{ matrix.deb_asset }}" \
          ./desktop/wails/packaging/package-linux-deb.sh

      - name: Generate checksum
        shell: bash
        run: |
          assets=("${{ matrix.desktop_asset }}")
          if [[ -n "${{ matrix.update_asset }}" && "${{ matrix.update_asset }}" != "${{ matrix.desktop_asset }}" ]]; then
            assets+=("${{ matrix.update_asset }}")
          fi
          if [[ -n "${{ matrix.deb_asset }}" ]]; then
            assets+=("${{ matrix.deb_asset }}")
          fi
          for file in "${assets[@]}"; do
            shasum -a 256 "dist/${file}" > "dist/${file}.sha256"
          done

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist/release-upload
          cp "dist/${{ matrix.desktop_asset }}" "dist/${{ matrix.desktop_asset }}.sha256" dist/release-upload/
          if [[ -n "${{ matrix.update_asset }}" && "${{ matrix.update_asset }}" != "${{ matrix.desktop_asset }}" ]]; then
            cp "dist/${{ matrix.update_asset }}" "dist/${{ matrix.update_asset }}.sha256" dist/release-upload/
          fi
          if [[ -n "${{ matrix.deb_asset }}" ]]; then
            cp "dist/${{ matrix.deb_asset }}" "dist/${{ matrix.deb_asset }}.sha256" dist/release-upload/
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/release-upload/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/release-upload/* --clobber

  update-manifest:
    name: Build Release Update Manifest
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop-apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download desktop workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-artifacts

      - name: Fetch GitHub release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > dist/release.json

      - name: Generate Wails update manifest
        shell: bash
        run: |
          go run ./scripts/release-update-manifest \
            -release-json dist/release.json \
            -artifacts-dir dist/release-artifacts \
            -output dist/update.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: dist/update.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" "dist/update.json" --clobber
