version: 1
tasks: []

# Examples:
#
# tasks:
#   - id: remind-standup
#     at: "2026-05-12 09:00"
#     tz: Asia/Tokyo
#     content: "提醒 [John](tg:@john) 参加站会"
#     chat_id: "tg:-1001234567890"
#
#   - id: weekly-report
#     cron: "0 10 * * 1"
#     tz: UTC+8
#     llm_profile: batch
#     content: "每周一检查项目周报"
#     bash_env:
#       - name: REPORT_MODE
#         value: weekly
#       - name: API_KEY
#         value: "${OPENAI_API_KEY}"
#       - name: AUTHORIZATION
#         value: "Bearer ${API_KEY}"
#     # Shorthand map form is also supported:
#     # bash_env:
#     #   - REPORT_MODE: weekly
#     #   - API_KEY: "${OPENAI_API_KEY}"
#
# Notes:
# - `cron` uses five fields: minute hour day-of-month month day-of-week.
# - Only numeric cron fields are supported; names such as MON or JAN are not supported.
# - Use IANA timezones or UTC offsets, for example UTC, Asia/Tokyo, America/Los_Angeles, or UTC+8.
# - Use exactly one of `at` or `cron`; `at` is one-time, `cron` is recurring.
# - `llm_profile` optionally selects one profile from `llm.profiles` for that task run.
# - If `llm_profile` does not exist, the runtime logs a warning and uses the route settings.
